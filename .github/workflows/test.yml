# Offline checks: lint, types and the tests that need no workspace.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      # For ucatlas's tests, which skip without Graphviz.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest -q
