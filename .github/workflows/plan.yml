# A pull request's plan for prod, in the job summary (docs/design.md, section 7).
# The check fails when the plan has a blocked change, since a merge couldn't
# apply it.
name: plan

on:
  pull_request:
    paths:
      - catalog/**
      - packages/ucmodel/**
      - packages/ucstate/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/plan.yml

permissions:
  contents: read

# A plan compiles the source locally and builds no shadow, unless the
# compiler declines a file (docs/offline.md). The shadow is then built in
# ucstate_shadow_pr, so plans run one at a time.
concurrency:
  group: ucstate-shadow-pr
  cancel-in-progress: false

jobs:
  plan:
    # A pull request from a fork gets no secrets, so there is nothing to plan with.
    # Nor does a repository with no workspace set up (no DATABRICKS_HOST).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && vars.DATABRICKS_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - name: Plan prod
        shell: bash
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set +e
          uv run ucstate --project catalog --shadow-catalog ucstate_shadow_pr \
            plan --target prod > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          {
            echo "### ucstate plan for prod"
            echo
            echo '```text'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
