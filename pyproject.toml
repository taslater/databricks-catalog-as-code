# The workspace that develops the three packages together. Each package has
# its own pyproject.toml, and only ucmodel is shared (README.md, Packages).
[project]
name = "uc-dev"
version = "0.1.0"
description = "Development environment for ucmodel, ucstate and ucatlas"
requires-python = ">=3.11"
dependencies = [
    "ucmodel",
    "ucstate",
    "ucatlas",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ucmodel = { workspace = true }
ucstate = { workspace = true }
ucatlas = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.ruff]
line-length = 100
src = ["packages/*/src", "packages/*/tests"]
# The Phase 0 probe script is kept exactly as it ran.
extend-exclude = ["probes/phase0.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["packages", "probes", "scripts"]

[tool.pyright]
include = ["packages", "probes", "scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages/ucmodel/tests", "packages/ucstate/tests", "packages/ucatlas/tests"]
