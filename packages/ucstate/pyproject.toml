[project]
name = "ucstate"
version = "0.1.0"
description = "Desired-state management for a Unity Catalog, from SQL source files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Slater" }]
keywords = ["databricks", "unity-catalog", "sql", "ddl", "schema-migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "ucmodel>=0.1.0a1,<0.2",
    "sqlglot>=30.27,<31",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/taslater/databricks-catalog-as-code"
Repository = "https://github.com/taslater/databricks-catalog-as-code"
Issues = "https://github.com/taslater/databricks-catalog-as-code/issues"
Changelog = "https://github.com/taslater/databricks-catalog-as-code/blob/main/CHANGELOG.md"

[project.scripts]
ucstate = "ucstate.cli:main"

[tool.uv.sources]
ucmodel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucstate"]
