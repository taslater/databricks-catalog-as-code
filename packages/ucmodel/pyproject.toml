[project]
name = "ucmodel"
version = "0.1.0a1"
description = "A Unity Catalog read over REST into a normalised model, and models compared"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Slater" }]
keywords = ["databricks", "unity-catalog", "sql", "ddl", "schema-migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "databricks-sdk>=0.158,<1",
    "sqlglot>=30.27,<31",
]

[project.scripts]
ucmodel = "ucmodel.cli:main"

[project.urls]
Homepage = "https://github.com/taslater/databricks-catalog-as-code"
Repository = "https://github.com/taslater/databricks-catalog-as-code"
Issues = "https://github.com/taslater/databricks-catalog-as-code/issues"
Changelog = "https://github.com/taslater/databricks-catalog-as-code/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucmodel"]
