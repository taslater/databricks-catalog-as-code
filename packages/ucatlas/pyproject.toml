[project]
name = "ucatlas"
version = "0.1.0"
description = "ER diagrams and lineage graphs of a Unity Catalog, as a static site"
readme = "README.md"
requires-python = ">=3.11"
# The explorer ships d3 (ISC) and elkjs (EPL-2.0, with a shim under Apache-2.0), unmodified.
license = "MIT AND ISC AND EPL-2.0 AND Apache-2.0"
license-files = ["LICENSE", "src/ucatlas/explorer/THIRD-PARTY-NOTICES.txt"]
authors = [{ name = "Thomas Slater" }]
keywords = ["databricks", "unity-catalog", "sql", "ddl", "schema-migration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
# It also needs Graphviz (see ucatlas.graphviz). The explorer reads SQL with sqlglot directly,
# and a metric view's YAML with PyYAML.
dependencies = [
    "ucmodel>=0.1.0,<0.2",
    "sqlglot>=30.27,<31",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/taslater/databricks-catalog-as-code"
Repository = "https://github.com/taslater/databricks-catalog-as-code"
Issues = "https://github.com/taslater/databricks-catalog-as-code/issues"
Changelog = "https://github.com/taslater/databricks-catalog-as-code/blob/main/CHANGELOG.md"

[project.scripts]
ucatlas = "ucatlas.cli:main"

[tool.uv.sources]
ucmodel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucatlas"]
