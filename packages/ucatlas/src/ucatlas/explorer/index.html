<style>

  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--ink); height:100vh; display:flex; flex-direction:column; }

  button.badge.warn { background:#fff8c5; border-color:#d4a72c; color:#7d4e00; cursor:pointer; }
  .gap { border-left:3px solid #bf8700; padding:4px 10px; margin:8px 0; background:#fffbea; }

  #searchbox { position:relative; flex:1; max-width:460px; }

  #results div.r { padding:6px 10px; cursor:pointer; border-bottom:1px solid #f0f0f0; }
  #results div.r:hover, #results div.r.sel { background:#f0f6ff; }
  .r .k { font-size:10px; text-transform:uppercase; color:var(--muted); margin-right:6px; } .r .why { color:var(--muted); font-size:12px; }
  main { flex:1; display:flex; min-height:0; }

  #view section { padding:12px 0 6px; border-bottom:1px solid var(--soft); }

  .seg { display:inline-flex; border:1px solid #afb8c1; border-radius:6px; overflow:hidden; background:#fff; }

  .seg button:first-child { border-left:0; } .seg button:hover { background:#f3f4f6; }

  aside#panel { width:390px; flex:none; border-left:1px solid var(--line); background:#fff; overflow:auto; padding:14px 16px; }
  aside h2 { font-size:16px; margin:0 0 2px; word-break:break-all; }

  .sub { color:var(--muted); }

  .chip.cert { background:#dafbe1; border-color:#4ac26b; } .chip.pii { background:#ffebe9; border-color:#ff8182; }

  table.cols { width:100%; border-collapse:collapse; font-size:12px; }

  code, pre { font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }

  .hop .expr { font-family:ui-monospace, Menlo, monospace; font-size:12px; background:#eef4ff; padding:1px 4px; border-radius:3px; }

  .finding.warn { border-color:#bf8700; } .finding.bad { border-color:var(--bad); }
  #tip { position:fixed; pointer-events:none; background:#1f2328; color:#fff; padding:6px 8px; border-radius:6px; font-size:12px; max-width:420px; z-index:50; display:none; }
  #tip code { color:#ffd8b5; }
  .page { flex:1; overflow:auto; padding:16px 20px; background:var(--bg); }
  .page h2 { font-size:18px; margin:4px 0 10px; } .page h3 { font-size:14px; margin:22px 0 8px; }
  .cards { display:flex; gap:12px; flex-wrap:wrap; }

  .card .t { font-weight:600; font-size:14px; } .card dl { display:grid; grid-template-columns:90px 1fr; gap:2px 8px; margin:8px 0 0; font-size:12px; }
  .card dt { color:var(--muted); } .card dd { margin:0; }
  table.grid { border-collapse:collapse; background:#fff; border:1px solid var(--line); font-size:12px; width:100%; }
  table.grid th, table.grid td { border:1px solid var(--line); padding:5px 7px; text-align:left; vertical-align:top; }
  table.grid th { background:#f6f8fa; }
  table.grid tr.differs td.concept { box-shadow: inset 3px 0 0 #bf8700; }
  table.grid td.empty { background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f2f2f2 6px,#f2f2f2 12px); }
  .cell-name { font-weight:600; } .cell-type { color:var(--muted); margin-left:4px; }
  .cell-expr { font-family:ui-monospace, Menlo, monospace; font-size:11px; color:#953800; display:block; margin-top:2px; }
  .cell-via { font-size:11px; color:var(--muted); }
  .bar { display:flex; height:22px; border-radius:4px; overflow:hidden; border:1px solid var(--line); margin:6px 0; }
  .bar div { display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; white-space:nowrap; overflow:hidden; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  #ancestry { height:520px; background:#fff; border:1px solid var(--line); border-radius:8px; }
  #ancestry svg { width:100%; height:100%; }
  .hidden { display:none !important; }
  /* svg */
  .node rect.box { fill:#fff; stroke:#c4cbd3; }
  .node.sel rect.box { stroke:var(--ink); stroke-width:2.5; }
  .node.focus rect.box { stroke:var(--accent); stroke-width:2.5; }
  .node.faded { opacity:.3; } .node { transition:opacity .15s; }
  .node text { font-size:12px; dominant-baseline:middle; }
  .node .hdr { cursor:pointer; }
  .node .row { cursor:pointer; } .node .row:hover rect { fill:#f0f6ff; }
  .node .row.up rect { fill:#ddf4ff; } .node .row.down rect { fill:#fbefff; } .node .row.picked rect { fill:#ffd8b5; }
  .handle { cursor:pointer; } .handle circle { fill:#fff; stroke:#8c959f; } .handle:hover circle { fill:var(--accent); stroke:var(--accent); }
  .handle text { font-size:10px; text-anchor:middle; dominant-baseline:central; fill:#57606a; } .handle:hover text { fill:#fff; }
  .edge { fill:none; stroke:#8c959f; stroke-width:1.4; transition:opacity .15s; }
  .edge.join { stroke-dasharray:2 3; stroke:#afb8c1; }

  .edge.quiet:not(.hl-up):not(.hl-down) { display:none; } /* an opened schema shows only its own edges, and what a selection lights */
  .edge.hl-up { stroke:var(--up); stroke-width:2.6; opacity:1; } .edge.hl-down { stroke:var(--down); stroke-width:2.6; opacity:1; }

</style>

<body>
<header>
  <h1>ucatlas explorer</h1>
  <span class="badge" id="snap"></span><button class="badge warn hidden" id="gaps"></button>
  <nav id="modes"><button data-mode="explore" class="on">Explore</button><button data-mode="compare">Compare</button><button data-mode="map">Map</button></nav>
  <div id="searchbox"><input id="search" placeholder="Search tables, columns, comments, tags…  ( / )" autocomplete="off"><div id="results"></div></div>
</header>
<main>
  <div id="view"></div>
  <div id="stage">
    <svg id="svg"><defs>
      <marker id="m-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8c959f"/></marker>
      <marker id="m-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#0969da"/></marker>
      <marker id="m-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8250df"/></marker>

      <marker id="m-edge-w" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8c959f"/></marker>
      <marker id="m-up-w" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#0969da"/></marker>
      <marker id="m-down-w" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8250df"/></marker>
      <marker id="m-runtime-w" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#fb8500"/></marker>
    </defs><g id="zoom"></g></svg>
    <div id="hint"></div>
  </div>
  <aside id="panel"></aside>
  <div id="page" class="page hidden"></div>
</main>
<div id="tip"></div>
<script>const GRAPH = /*GRAPH*/null;</script>
<script>
"use strict";
const G = GRAPH;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "—" : Number(n).toLocaleString("en-US");
const when = s => s ? s.replace("T", " ").replace(/:\d\dZ$/, " UTC") : "—";
const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
$("#snap").textContent = `${G.meta.catalog} · ${when(G.meta.taken_at)}`;
$("#snap").title = [`A snapshot of ${G.meta.catalog}${G.meta.snapshot ? " (" + G.meta.snapshot + ")" : ""}, taken ${when(G.meta.taken_at)}.`,
  G.meta.lineage ? "Lineage the platform recorded is included." : "The snapshot has no lineage the platform recorded: edges come from SQL only.",
  `${G.meta.statements} statements read with sqlglot ${G.meta.sqlglot}, from view definitions${G.meta.sql_files ? ` and ${G.meta.sql_files} SQL files` : ""}.`].join("\n");
if (G.gaps.length) { $("#gaps").textContent = `⚠ ${G.gaps.length} lineage gap${G.gaps.length === 1 ? "" : "s"}`; $("#gaps").classList.remove("hidden"); }

// ---------------------------------------------------------------- the graph's indexes
const byId = new Map(G.nodes.map(n => [n.id, n]));
const tableOf = cid => cid.slice(0, cid.lastIndexOf("."));
const colName = cid => cid.slice(cid.lastIndexOf(".") + 1);
const up = new Map(), down = new Map(), colUp = new Map(), colDown = new Map();
G.table_edges.forEach(e => { push(up, e.t, e); push(down, e.s, e); });
G.column_edges.forEach(e => { push(colUp, e.t, e); push(colDown, e.s, e); });
const schemaNames = G.schemas.map(s => s.name);
const PALETTE = ["#4e79a7","#f28e2b","#e15759","#76b7b2","#59a14f","#edc948","#b07aa1","#ff9da7","#9c755f","#bab0ac"];
const schemaColor = s => PALETTE[schemaNames.indexOf(s) % PALETTE.length] || "#999";
// when a table was last written, by the lineage the platform recorded, as of the snapshot
const TAKEN = Date.parse(G.meta.taken_at);
const AGE = { day:"#dafbe1", week:"#eef7d8", month:"#fff1c2", older:"#ffd7d5", unseen:"#eaeef2", view:"#ffffff", outside:"#f6f8fa" };
const AGE_TEXT = { day:"written in the day before", week:"in the week before", month:"in the 30 days before", older:"over 30 days before",
  unseen:"no write in the lineage", view:"a view", outside:"outside the snapshot" };
function age(n) {
  if (n.kind === "view") return "view";
  if (n.kind !== "table") return "outside";
  if (!n.written) return "unseen";
  const days = (TAKEN - Date.parse(n.written)) / 864e5;
  return days <= 1 ? "day" : days <= 7 ? "week" : days <= 30 ? "month" : "older";
}
const label = id => { const n = byId.get(id); return n ? (n.kind === "files" ? n.name : n.id) : id; };
const short = id => id.startsWith("files:") ? id.slice(6).replace(/^\/Volumes\//, "…/") : id;

// every relationship between two tables, by kind; a foreign key runs from the parent to the child
const kindOf = e => !e.static ? "runtime" : e.role === "join" ? "join" : "flow";
const EDGES = G.table_edges.map(e => ({ ...e, kind:kindOf(e) }));
G.nodes.forEach(n => n.fks.forEach(f => EDGES.push({ s:f.references, t:n.id, kind:"fk", fk:f, static:true, observed:null, via:f.name })));
EDGES.forEach((e, i) => e.id = "e" + i);

// declared keys hold the same values on both sides
const uf = new Map();
const find = x => { while (uf.has(x) && uf.get(x) !== x) x = uf.get(x); return x; };
G.fk_edges.forEach(e => { const a = find(e.s), b = find(e.t); if (a !== b) uf.set(a, b); });

function closure(start, adj, key, hops = Infinity) {
  const seen = new Map([[start, 0]]); let frontier = [start];
  for (let d = 1; d <= hops && frontier.length; d++) {
    const next = [];
    for (const x of frontier) for (const e of adj.get(x) || []) { const y = e[key]; if (!seen.has(y)) { seen.set(y, d); next.push(y); } }
    frontier = next;
  }
  return seen;
}
const dependentsCache = new Map(); // how many objects are downstream: a measure of how much rests on one
const dependents = id => { if (!dependentsCache.has(id)) dependentsCache.set(id, closure(id, down, "t").size - 1); return dependentsCache.get(id); };
const rootCache = new Map();
function roots(cid) { // the furthest-upstream catalog columns a column's values come from
  if (rootCache.has(cid)) return rootCache.get(cid);
  const out = new Set(), stack = [cid], seen = new Set();
  while (stack.length) {
    const c = stack.pop(); if (seen.has(c)) continue; seen.add(c);
    const ins = (colUp.get(c) || []).filter(e => !tableOf(e.s).startsWith("files:"));
    if (!ins.length) out.add(find(c)); else ins.forEach(e => stack.push(e.s));
  }
  rootCache.set(cid, out); return out;
}
function filtersUpstream(tid) { // the conditions that decide which rows reach a table, nearest first
  const out = [], dist = closure(tid, up, "s");
  [...dist.entries()].sort((a, b) => a[1] - b[1]).forEach(([t, d]) =>
    (byId.get(t)?.writers || []).forEach(w => w.filters.forEach(f => out.push({ table:t, via:w.via, filter:f, own:d === 0 }))));
  return out;
}
function derivation(cid) {
  const hops = [], seen = new Set(), queue = [[cid, 0]];
  while (queue.length) { const [c, depth] = queue.shift(); if (seen.has(c)) continue; seen.add(c);
    for (const e of colUp.get(c) || []) { hops.push({ ...e, depth }); queue.push([e.s, depth + 1]); } }
  return hops;
}
function nearestExpr(cid) { // the first expression above a column that isn't a plain copy
  const hops = derivation(cid), first = hops.find(h => h.steps.length)?.depth;
  if (first == null) return null;
  const at = hops.filter(h => h.depth === first && h.steps.length);
  return { exprs:[...new Set(at.map(h => h.steps[0]))], via:[...new Set(at.map(h => h.via))] };
}
function groupHops(hops) { // one entry per column, one line per way it is computed
  const by = new Map();
  hops.forEach(h => { if (!by.has(h.t)) by.set(h.t, { t:h.t, depth:h.depth, ways:new Map() });
    const k = h.steps.join(" ← ") + "|" + h.via, ways = by.get(h.t).ways;
    if (!ways.has(k)) ways.set(k, { steps:h.steps, via:h.via, sources:[] }); ways.get(k).sources.push(h.s); });
  return [...by.values()].map(g => ({ ...g, ways:[...g.ways.values()] }));
}

// ---------------------------------------------------------------- state
// start on the object with the most relationships
const degree = new Map(); EDGES.forEach(e => { degree.set(e.s, (degree.get(e.s) || 0) + 1); degree.set(e.t, (degree.get(e.t) || 0) + 1); });
const START = G.nodes.filter(n => n.kind === "table" || n.kind === "view").sort((a, b) => (degree.get(b.id) || 0) - (degree.get(a.id) || 0) || a.id.localeCompare(b.id))[0]?.id || G.nodes[0]?.id;
const state = {
  mode:"explore", focus:START, selected:START, lit:false, column:null, panel:null,
  up:2, down:1, columns:"auto",
  rel:{ flow:true, join:true, runtime:true, fk:false }, markUnseen:false,
  include:{ files:true, views:true, outside:true }, schemas:new Set(schemaNames), hidden:new Set(), extra:new Set(),
  arrange:"layered", direction:"right", group:false, color:"schema", highlight:"direct",
  history:[], compare:[],
  mapColor:"schema", mapHighlight:"lineage", route:null, query:"",
  mapLevel:null, mapSchema:null, selSchema:null, // the map's level (decided on first visit), the schema it is zoomed to, the schema selected
};

// ---------------------------------------------------------------- search
const index = [];
G.nodes.forEach(n => {
  index.push({ kind:n.kind, id:n.id, text:`${n.id} ${n.comment || ""} ${Object.entries(n.tags).map(([k, v]) => k + " " + v).join(" ")}`, label:label(n.id), why:n.comment });
  n.columns.forEach(c => index.push({ kind:"column", id:`${n.id}.${c.name}`, text:`${c.name} ${c.comment || ""} ${Object.keys(c.tags).join(" ")}`, label:`${short(n.id)}.${c.name}`, why:c.comment }));

  while (x !== from) { const p = prev.get(x); hops.unshift({ a:p.from, b:x, on:[p.e.here, p.e.there], j:p.e.j }); x = p.from; }

function panelRoute() {

  const alias = new Map(r.path.map((t, i) => [t, (byId.get(t).name.match(/[a-z]/g) || ["t"])[0] + (i + 1)]));
  const col = cid => `${alias.get(tableOf(cid))}.${colName(cid)}`;
  const sql = `SELECT …\nFROM ${r.path[0]} AS ${alias.get(r.path[0])}\n` + r.hops.map(h => `JOIN ${h.b} AS ${alias.get(h.b)} ON ${col(h.on[1])} = ${col(h.on[0])}`).join("\n");

    ${r.hops.map(h => { const [card, warn] = cardinality(h), j = h.j;
      return `<div class="hop"><code>${esc(short(h.on[0]))}</code> = <code>${esc(short(h.on[1]))}</code><br>
        <span class="sub">${[j.declared ? "declared key " + esc(j.declared) : "", j.code.length ? "joined in " + j.code.map(viaText).join(", ") : ""].filter(Boolean).join(" · ")}</span><br>
        <b>${card}</b>${warn ? ` <span class="status stale">${esc(warn)}</span>` : ""}</div>`; }).join("")}
    <h3>A starting point</h3><pre>${esc(sql)}</pre>`;

const trust = n => (n.tags.certified ? 1000 : 0) + dependents(n.id);
function panelCompass() {
  const q = state.query && search(state.query);

    .sort((a, b) => trust(b) - trust(a)) : null;
  const card = n => `<div class="card" style="margin:8px 0;border-top-color:${schemaColor(n.schema)}"><div class="t"><a href="#" data-goto="${esc(n.id)}">${esc(n.id)}</a> ${n.tags.certified ? '<span class="chip cert">certified</span>' : ""}</div>
    <div class="sub">${esc(n.comment)}</div><dl><dt>grain</dt><dd>${n.grain ? "one row per " + esc(n.grain) : "not stated"}</dd><dt>downstream</dt><dd>${dependents(n.id)} objects</dd>
    <dt>last written</dt><dd>${written(n)}</dd><dt>owner</dt><dd>${esc(n.owner || "—")}</dd></dl></div>`;
  $("#panel").innerHTML = cands ? `<h2>Tables for “${esc(state.query)}”</h2><p class="sub">Certified first, then those the most objects depend on. Check the grain before you pick.</p>${cands.map(card).join("") || "<p>Nothing matches.</p>"}`
    : `<h2>Compass</h2><p>Search for business words (<i>revenue</i>, <i>refund</i>, <i>campaign</i>) and the map lights up where they live, with the most trusted tables listed here.</p>
      <h3>Where to start, by domain</h3>${G.schemas.filter(s => !s.outside && s.name !== "(files)").map(s => { const top = G.nodes.filter(n => n.schema === s.name).sort((a, b) => trust(b) - trust(a)).slice(0, 2);
        return `<div style="margin:6px 0"><span class="chip" style="border-color:${schemaColor(s.name)}">${esc(s.name)}</span> <span class="sub">${esc(s.comment)}</span><br>${top.map(n => `<a href="#" data-goto="${esc(n.id)}">${esc(n.name)}</a>${n.tags.certified ? " ✓" : ""} <span class="sub">${dependents(n.id)} downstream</span>`).join(" · ")}</div>`; }).join("")}`;

// ---------------------------------------------------------------- compare
const family = t => /int|decimal|double|float|long|bigint/.test(t) ? "num" : /date|timestamp/.test(t) ? "time" : "text";
const tokens = s => new Set(s.toLowerCase().split(/_/).filter(Boolean));
const jac = (a, b) => { if (!a.size && !b.size) return 0; let i = 0; a.forEach(x => b.has(x) && i++); return i / (a.size + b.size - i); };
const stripAgg = e => { const m = /^(SUM|COUNT|AVG|MIN|MAX)\((.*)\)$/i.exec(e); return m ? m[2] : e; };
function exprKey(cid) { // what a column computes, ignoring aliases and a final aggregate
  const ne = nearestExpr(cid); if (!ne) return "(copied)";
  return ne.exprs.map(e => stripAgg(e).replace(/\b[a-z_]\w*\./gi, "")).map(e => /^\w+$/.test(e) ? "(copied)" : e).sort().join(" | ");
}
function align(tables) {
  const cols = tables.map(t => byId.get(t).columns.map(c => ({ t, c, cid:`${t}.${c.name}`, roots:roots(`${t}.${c.name}`) })));
  const ufc = new Map(), f = x => { while (ufc.has(x) && ufc.get(x) !== x) x = ufc.get(x); return x; };
  for (let i = 0; i < cols.length; i++) for (let j = i + 1; j < cols.length; j++) {
    const pairs = [];
    cols[i].forEach(a => cols[j].forEach(b => {
      const s = (0.7 * jac(a.roots, b.roots) + 0.3 * (a.c.name === b.c.name ? 1 : jac(tokens(a.c.name), tokens(b.c.name)))) * (family(a.c.type) === family(b.c.type) ? 1 : 0.4);
      if (s >= 0.3) pairs.push([s, a.cid, b.cid]); }));
    pairs.sort((x, y) => y[0] - x[0]); const usedA = new Set(), usedB = new Set();
    pairs.forEach(([, a, b]) => { if (usedA.has(a) || usedB.has(b)) return; usedA.add(a); usedB.add(b); const ra = f(a), rb = f(b); if (ra !== rb) ufc.set(ra, rb); });
  }
  const groups = new Map();
  cols.flat().forEach(x => { const r = f(x.cid); if (!groups.has(r)) groups.set(r, {}); const g = groups.get(r); if (!g[x.t]) g[x.t] = x; });
  return [...groups.values()].map(g => {
    const members = Object.values(g), names = members.map(m => m.c.name);
    const name = names.sort((a, b) => names.filter(x => x === b).length - names.filter(x => x === a).length)[0];
    const exprs = members.map(m => exprKey(m.cid)), raw = members.map(m => JSON.stringify(nearestExpr(m.cid)?.exprs || []));
    return { name, g, isKey:members.some(m => byId.get(m.t).pk.includes(m.c.name)), width:members.length,
      differs:members.length > 1 && new Set(exprs).size > 1, summed:members.length > 1 && new Set(exprs).size === 1 && new Set(raw).size > 1 };
  }).sort((a, b) => (b.isKey - a.isKey) || (b.width - a.width) || a.name.localeCompare(b.name));
}
function findings(tables, rows) {
  const out = [], ns = tables.map(t => byId.get(t));
  if (new Set(ns.map(n => n.grain)).size > 1) out.push(["warn", `<b>Different grains.</b> ${ns.map(n => `${esc(n.name)}: one row per ${esc(n.grain || "?")}`).join("; ")}. Compare them only at a grain they can all reach.`]);
  tables.forEach(t => { const fs = filtersUpstream(t); if (fs.length) out.push(["warn", `<b>${esc(t)}</b> only sees rows where ${fs.map(f => `<code>${esc(f.filter)}</code>${f.own ? "" : ` <span class="sub">(at ${esc(f.table)})</span>`}`).join(" and ")}.`]); });
  // where each one's data starts: the objects upstream of it that nothing feeds
  const origins = tables.map(t => new Set([...closure(t, up, "s").keys()].filter(x => x !== t && !(up.get(x) || []).length)));
  const shared = [...origins[0]].filter(x => origins.every(o => o.has(x)));
  out.push(["", `<b>Sources.</b> ${shared.length ? `All of them start from ${shared.map(link).join(", ")}.` : "They start from no source in common."} ${tables.map((t, i) => { const only = [...origins[i]].filter(x => !origins.every(o => o.has(x))); return only.length ? `${esc(byId.get(t).name)} also starts from ${only.map(link).join(", ")}.` : ""; }).join(" ")}`]);
  rows.filter(r => r.differs && !r.isKey && Object.values(r.g).every(m => family(m.c.type) === "num")).forEach(r =>
    out.push(["bad", `<b>${esc(r.name)}</b> is computed ${Object.keys(r.g).length} different ways: ${Object.values(r.g).map(m => `${esc(m.t.split(".")[1])}.${esc(m.c.name)} = <code>${esc((nearestExpr(m.cid)?.exprs || ["(copied)"]).join(" | "))}</code>`).join("; ")}.`]));
  rows.filter(r => r.summed && Object.values(r.g).every(m => family(m.c.type) === "num")).forEach(r =>
    out.push(["", `<b>${esc(r.name)}</b> is the same value, summed to a coarser grain: ${Object.values(r.g).map(m => `${esc(m.t.split(".")[1])}.${esc(m.c.name)}`).join(", ")}.`]));
  rows.filter(r => r.isKey && r.differs && Object.values(r.g).every(m => family(m.c.type) !== "time")).forEach(r =>
    out.push(["", `<b>Same ids, written differently:</b> ${Object.values(r.g).map(m => `${esc(m.c.name)} = <code>${esc((nearestExpr(m.cid)?.exprs || ["(copied)"]).join(" | "))}</code>`).join(" vs ")}. Matching rows means normalizing the ids first.`]));
  if (G.meta.lineage && new Set(ns.map(age)).size > 1) out.push(["warn", `<b>Last written:</b> ${ns.map(n => `${esc(n.name)} ${n.kind === "table" ? (n.written ? when(n.written) : "not in the lineage") : "(a view)"}`).join("; ")}.`]);

}
// an id built as CONCAT('<prefix>', <source id>), rebuilt as <source schema>:<id>, so tables that prefix

function keyNormalizer(cid, al) {

  if (first == null) return c;
  const parts = [];
  hops.filter(h => h.depth === first && h.steps.length).forEach(h => {
    const m = h.steps.map(s => /CONCAT\('([^']*)'/i.exec(s)).find(Boolean); if (!m) return;
    const src = [...roots(h.s)].map(r => byId.get(tableOf(r))?.schema).find(Boolean) || tableOf(h.s).split(".")[0];
    if (!parts.some(p => p[0] === m[1])) parts.push([m[1], src]);

  if (!parts.length) return c;
  return `CASE ${parts.map(([p, s]) => `WHEN startswith(${c}, '${p}') THEN '${s}'`).join(" ")} END\n    || ':' || regexp_extract(${c}, '([0-9]+)$', 1)`;

const fq = t => inCatalog(byId.get(t)) ? `${G.meta.catalog}.${t}` : t; // the name to run SQL with
function checksSql(tables, rows) {
  const out = [];
  tables.forEach(t => { const n = byId.get(t); if (!n.columns.length) return;
    out.push({ title:n.pk.length ? `Is the grain of ${t} real? Keys are declared, not enforced.` : `${t} declares no key: does ${n.columns[0].name} repeat?`, kind:"grain", t,
      sql:`SELECT count(*) AS rows, count(DISTINCT ${(n.pk.length ? n.pk : [n.columns[0].name]).join(", ")}) AS keys\nFROM ${fq(t)}` }); });
  for (let i = 0; i < tables.length; i++) for (let j = i + 1; j < tables.length; j++) {
    const a = tables[i], b = tables[j];
    const keyRow = rows.find(r => r.isKey && r.g[a] && r.g[b] && byId.get(a).pk.includes(r.g[a].c.name) && byId.get(b).pk.includes(r.g[b].c.name));
    if (!keyRow) continue;
    const measure = rows.find(r => !r.isKey && r.g[a] && r.g[b] && family(r.g[a].c.type) === "num" && r.differs);
    const side = (t, al, m) => `SELECT ${keyNormalizer(m.cid, al)} AS id${measure ? `, sum(${al}.${measure.g[t].c.name}) AS m` : ""}\n  FROM ${fq(t)} AS ${al} GROUP BY 1`;
    out.push({ title:`Do ${a} and ${b} hold the same ${keyRow.name.replace(/_(key|ref|id)$/, "")}s?`, kind:"overlap", pair:[a, b],
      sql:`WITH a AS (\n  ${side(a, "a", keyRow.g[a])}\n), b AS (\n  ${side(b, "b", keyRow.g[b])}\n)\nSELECT count_if(a.id IS NOT NULL AND b.id IS NOT NULL) AS both,\n  count_if(b.id IS NULL) AS only_a, count_if(a.id IS NULL) AS only_b${measure ? `,\n  avg(CASE WHEN abs(a.m - b.m) <= 0.01 * abs(b.m) THEN 1 ELSE 0 END) AS agree_within_1p` : ""}\nFROM a FULL OUTER JOIN b ON a.id = b.id` });
  }

}
async function renderCompare() {
  const tables = state.compare.filter(t => byId.has(t)), page = $("#page");
  if (tables.length < 2) { page.innerHTML = `<h2>Compare tables</h2><p>Add two or more tables with the search box. ${tables.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</p>`; return; }
  const rows = align(tables), fs = findings(tables, rows), checks = checksSql(tables, rows), cc = t => PALETTE[tables.indexOf(t) % PALETTE.length];
  page.innerHTML = `<h2>Compare ${tables.length} tables <span class="sub" style="font-size:13px;font-weight:normal">· add more with the search box</span></h2>
    <div class="cards">${tables.map(t => { const n = byId.get(t);
      return `<div class="card" style="border-top-color:${cc(t)}"><div class="t">${esc(t)} <a href="#" data-rm="${esc(t)}" title="remove" style="float:right;text-decoration:none">×</a></div><div class="sub">${esc(n.comment)}</div><dl>
        <dt>grain</dt><dd>${n.grain ? "one row per " + esc(n.grain) : "<b>not stated</b>"}</dd><dt>key</dt><dd>${n.pk.length ? esc(n.pk.join(", ")) : "<b>none declared</b>"}</dd>
        <dt>written by</dt><dd>${n.writers.map(w => viaText(w.via)).join(", ") || "—"}</dd><dt>last written</dt><dd>${written(n)}</dd>
        <dt>downstream</dt><dd>${dependents(t)} objects</dd><dt>status</dt><dd>${n.tags.certified ? '<span class="chip cert">certified</span>' : "not certified"}${n.owner ? " · " + esc(n.owner) : ""}</dd></dl></div>`; }).join("")}</div>
    <h3>What's different</h3>${fs.map(([k, h]) => `<div class="finding ${k}">${h}</div>`).join("")}
    <h3>Columns, lined up by where their values come from</h3>
    <p class="sub">Columns share a row when their values trace back to the same source columns (declared keys count as the same values), or failing that, similar names. A marked row is computed differently in different tables. Click a cell to trace it.</p>
    <table class="grid"><tr><th>concept</th>${tables.map(t => `<th style="border-top:3px solid ${cc(t)}">${esc(t)}</th>`).join("")}</tr>
    ${rows.map(r => `<tr class="${r.differs ? "differs" : ""}"><td class="concept"><b>${esc(r.name)}</b>${r.isKey ? ' <span class="chip">key</span>' : ""}</td>${tables.map(t => { const m = r.g[t]; if (!m) return `<td class="empty"></td>`;
      const ne = nearestExpr(m.cid); return `<td data-cell="${esc(m.cid)}" style="cursor:pointer"><span class="cell-name">${esc(m.c.name)}</span><span class="cell-type">${esc(m.c.type)}</span>${ne ? ne.exprs.map(e => `<span class="cell-expr">${esc(e)}</span>`).join("") + `<span class="cell-via">${esc(ne.via.join(", "))}</span>` : `<span class="cell-via">copied from upstream</span>`}</td>`; }).join("")}</tr>`).join("")}</table>
    <h3>Shared ancestry</h3><p class="sub">Everything upstream of the compared tables. The colored squares on each box show which compared tables it feeds: a box with every color is a shared source. Hover a box to see its edges.</p>
    <div id="ancestry"><svg><g id="anc"></g></svg></div><div class="sub" id="anc-note" style="margin-top:4px"></div>
    <h3>Checks to run on a warehouse</h3><p class="sub">Written from what the lineage says about keys and measures. ucatlas doesn't run them: copy one into a SQL editor.</p>
    <div class="two">${checks.map((c, i) => `<div class="card" style="border-top-color:#8c959f"><div class="t">${esc(c.title)}</div><pre>${esc(c.sql)}</pre>
      <button class="btn" data-copy="${i}">Copy the SQL</button></div>`).join("") || `<p class="sub">None: the tables share no declared key.</p>`}</div>
    <h3>What reads each</h3><div class="cards">${tables.map(t => { const d = closure(t, down, "t"); d.delete(t);
      return `<div class="card" style="border-top-color:${cc(t)}"><div class="t">${esc(t)}</div><p>${d.size} objects downstream</p>${[...d.keys()].map(x => `<div>→ ${link(x)}</div>`).join("")}</div>`; }).join("")}</div>`;
  page.querySelectorAll("[data-rm]").forEach(a => a.onclick = ev => { ev.preventDefault(); state.compare = state.compare.filter(t => t !== a.dataset.rm); render(); });
  page.querySelectorAll("[data-goto]").forEach(a => a.onclick = ev => { ev.preventDefault(); focusOn(a.dataset.goto); });
  page.querySelectorAll("[data-cell]").forEach(td => td.onclick = () => focusOn(tableOf(td.dataset.cell), td.dataset.cell));
  page.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(checks[+b.dataset.copy].sql); b.textContent = "Copied"; } catch { b.textContent = "Select the SQL above to copy it"; } });
  const feeds = new Map(); tables.forEach(t => closure(t, up, "s").forEach((d, x) => push(feeds, x, t)));
  const ids = [...feeds.keys()], edges = EDGES.filter(e => e.kind !== "fk" && feeds.has(e.s) && feeds.has(e.t)), AW = 200, AH = 30;
  const L = await layout(ids.map(id => ({ id, width:AW, height:AH })), edges, { layer:60, gap:12 });
  $("#anc-note").textContent = crossingNote(L);
  const box = d3.select("#anc"), asvg = d3.select("#ancestry svg"), els = [];
  edges.forEach(e => { const pts = L.paths.get(e.id); if (!pts) return; const base = edgeClass(e);
    els.push({ e, base, el:box.append("path").attr("class", base).attr("d", curve(pts)).attr("marker-end", markerFor(base)) }); });
  L.pos.forEach((p, id) => {
    const n = byId.get(id), fed = feeds.get(id), mine = tables.includes(id);
    const g = box.append("g").attr("class", "node").attr("transform", `translate(${p.x},${p.y})`);
    g.append("rect").attr("class", "box").attr("width", AW).attr("height", AH).attr("rx", 5).style("stroke", mine ? cc(id) : null).style("stroke-width", mine ? 3 : null).style("fill", fed.length === tables.length && !mine ? "#fff8c5" : "#fff");
    g.append("rect").attr("width", 5).attr("height", AH).style("fill", schemaColor(n.schema));
    g.append("text").attr("x", 10).attr("y", AH / 2).text(trunc(short(id), 24));
    tables.forEach((t, i) => { if (fed.includes(t)) g.append("rect").attr("x", AW - 8 - (tables.length - i) * 9).attr("y", AH - 9).attr("width", 7).attr("height", 5).style("fill", cc(t)); });
    g.on("mouseenter", () => els.forEach(({ e, el, base }) => { const c = e.t === id ? base + " hl-up" : e.s === id ? base + " hl-down" : base + " faded"; el.attr("class", c).attr("marker-end", markerFor(c)); }))
     .on("mousemove", ev => showTip(ev, `<b>${esc(short(id))}</b><br>feeds ${fed.map(esc).join(", ")}`))
     .on("mouseleave", () => { hideTip(); els.forEach(({ el, base }) => el.attr("class", base).attr("marker-end", markerFor(base))); });
  });
  const r = $("#ancestry").getBoundingClientRect(), k = Math.min(1, (r.width - 20) / L.width, (r.height - 20) / L.height);
  const az = d3.zoom().scaleExtent([.2, 2]).on("zoom", e => box.attr("transform", e.transform));
  asvg.call(az).call(az.transform, d3.zoomIdentity.translate((r.width - L.width * k) / 2, (r.height - L.height * k) / 2).scale(k));
}

addEventListener("resize", () => { if (state.mode !== "compare") render(); });
if (G.nodes.length) render();
else $("#stage").innerHTML = `<p style="padding:20px">The snapshot has no tables or views.</p>`;
